<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Stabirush VPN</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <svg class="brand-logo" width="22" height="22" viewBox="0 0 32 32" fill="none">
        <rect width="32" height="32" rx="8" fill="#1e293b"/>
        <line x1="8" y1="16" x2="15" y2="16" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="15" y1="16" x2="23" y2="9" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="15" y1="16" x2="23" y2="23" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="23" y1="9" x2="23" y2="23" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2"/>
        <circle cx="8" cy="16" r="3" fill="#f8fafc"/>
        <circle cx="15" cy="16" r="4" fill="#10b981"/>
        <circle cx="23" cy="9" r="3" fill="#38bdf8"/>
        <circle cx="23" cy="23" r="3" fill="#38bdf8"/>
      </svg>
      <span class="brand-title">Stabirush · wg0</span>
    </div>
    <div id="status-pill" class="status-pill">
      <span class="status-dot"></span>
      <span id="status-text">Disconnected</span>
    </div>
  </header>

  <main class="container">
    <div id="error-box" class="error-msg"></div>

    <div class="hero-card">
      <div class="hero-info">
        <h2 id="hero-title">Stabirush Tunnel</h2>
        <div class="hero-sub" id="hero-sub">10.10.0.1 · Split Tunnel</div>
      </div>
      <label class="switch" title="Aktifkan/Matikan Stabirush VPN">
        <input type="checkbox" id="vpn-toggle">
        <span class="slider"></span>
      </label>
    </div>

    <div>
      <div class="section-label">
        <span>VPN Client Mode</span>
        <span id="ping-badge"></span>
      </div>
      <div class="mode-group">
        <button type="button" id="mode-split" class="mode-btn active">Split (Private IPs)</button>
        <button type="button" id="mode-full" class="mode-btn">🔒 Secure (0.0.0.0/0)</button>
      </div>
    </div>

    <div>
      <div class="section-label">
        <span>Active Route Scope</span>
      </div>
      <div class="routes-box" id="routes-list">
        <span class="route-badge">10.10.0.*</span>
        <span class="route-badge">192.168.101.*</span>
        <span class="route-badge">10.0.0.*</span>
      </div>
    </div>

    <div>
      <div class="section-label">
        <span>Quick Access (Stabirush Network)</span>
      </div>
      <div class="quick-links">
        <button type="button" class="quick-btn" data-url="http://10.10.0.1:51821">
          <span>Stabirush Admin</span>
          <small>10.10.0.1:51821</small>
        </button>
        <button type="button" class="quick-btn" data-url="http://10.0.0.154:3000">
          <span>AdGuard Home</span>
          <small>10.0.0.154:3000</small>
        </button>
        <button type="button" class="quick-btn" data-url="http://192.168.101.1">
          <span>LAN Router 101</span>
          <small>192.168.101.1</small>
        </button>
        <button type="button" class="quick-btn" data-url="http://10.10.0.4">
          <span>Subnet Peer .4</span>
          <small>10.10.0.4</small>
        </button>
      </div>
    </div>

    <button type="button" id="btn-toggle-settings" class="settings-toggle">
      ⚙ Konfigurasi Gateway &amp; Subnet
    </button>

    <div id="settings-panel" class="settings-panel">
      <div class="field">
        <label>Stabirush Gateway (IP:Port)</label>
        <input type="text" id="input-server" placeholder="168.110.193.226:51821">
      </div>
      <div class="field">
        <label>Private IP Patterns (pisahkan koma)</label>
        <input type="text" id="input-patterns" placeholder="10.10.0.*, 192.168.101.*, 10.0.0.*">
      </div>
      <div class="field">
        <label>Gateway Token</label>
        <input type="password" id="input-token" placeholder="stabirush-ext-2026">
      </div>
      <button type="button" id="btn-save-settings" class="btn-save">Simpan &amp; Terapkan</button>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
